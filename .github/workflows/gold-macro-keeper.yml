name: GoldMacroAI cloud keeper

# GitHub 原生 schedule 事件在本仓库完全不触发，因此用一个云端常驻的
# workflow_dispatch 链代替定时器：每次运行等到下一个 UTC 整点后 1 分钟
# （hh:01），触发日报工作流，再触发下一次 keeper。每小时检查一次；
# 周末休市（北京周六 06:00 -> 周一 06:00）暂停采集与推送，keeper 仍链式运行；
# 交易时段日报/图表仅在 CRT 成立时推送，未成立时静默。全程云端完成，不依赖本地电脑。
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Compute next dispatch time
        id: timing
        run: |
          python3 - <<'PY' > seconds.txt
          import math
          from datetime import datetime, timedelta, timezone

          now = datetime.now(timezone.utc)
          nxt = now.replace(minute=1, second=0, microsecond=0)
          if nxt <= now:
              nxt += timedelta(hours=1)
          # ceil: never wake up before the target second, otherwise the next
          # keeper could compute the same target again and duplicate a report.
          print(math.ceil((nxt - now).total_seconds()))
          PY
          seconds="$(cat seconds.txt)"
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          echo "next=$(date -u -d "@$(( $(date +%s) + seconds ))" '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"
          echo "Next dispatch: $(date -u -d "@$(( $(date +%s) + seconds ))" '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Wait until target
        run: |
          seconds="${{ steps.timing.outputs.seconds }}"
          echo "Waiting $seconds seconds"
          sleep "$seconds"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check market hours
        id: market
        run: |
          python3 - <<'PY' > market_status.txt
          from scheduler.market_hours import market_closed_status

          closed, reason = market_closed_status()
          print("closed=true" if closed else "closed=false")
          print(f"status={reason}")
          PY
          cat market_status.txt >> "$GITHUB_OUTPUT"
          cat market_status.txt

      - name: Dispatch report
        if: steps.market.outputs.closed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run gold-macro.yml --repo lyjiiiirr-crypto/GoldMacroAI --ref main
          echo "Macro report dispatched at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Skip report (market closed)
        if: steps.market.outputs.closed == 'true'
        run: echo "周末休市，跳过本次采集与推送；keeper 继续链式运行。"

      - name: Chain next keeper run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run gold-macro-keeper.yml --repo lyjiiiirr-crypto/GoldMacroAI --ref main; then
              echo "Next keeper chained at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              exit 0
            fi
            sleep 60
          done
          echo "Failed to chain next keeper run"
          exit 1
