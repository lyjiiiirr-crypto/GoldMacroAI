name: GoldMacroAI scheduled run

on:
  workflow_dispatch:

# GitHub 原生 schedule 在本仓库不产生任何 run（已验证 0 次），
# 改由 gold-macro-keeper.yml 在云端每小时（UTC hh:06）触发本工作流。
# 同一时段只允许一个日报任务，避免重复推送。
concurrency:
  group: gold-macro-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run macro job
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUD_AI_BASE_URL: ${{ secrets.CLOUD_AI_BASE_URL }}
          CLOUD_AI_API_KEY: ${{ secrets.CLOUD_AI_API_KEY }}
          CLOUD_AI_MODEL: ${{ secrets.CLOUD_AI_MODEL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python main.py --scheduled

      - name: Persist history database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f database/gold_macro.db
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GoldMacroAI history database"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
