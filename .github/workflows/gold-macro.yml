name: GoldMacroAI scheduled run

on:
  schedule:
    # TradingView 4H 收线为北京时间 10/14/18/22/02/06（UTC 02/06/10/14/18/22）
    # 收线后 1 分钟内采集；GitHub 定时可能延迟，无法保证秒级精确
    - cron: '1 2,6,10,14,18,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run macro job
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUD_AI_BASE_URL: ${{ secrets.CLOUD_AI_BASE_URL }}
          CLOUD_AI_API_KEY: ${{ secrets.CLOUD_AI_API_KEY }}
          CLOUD_AI_MODEL: ${{ secrets.CLOUD_AI_MODEL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python main.py --scheduled

      - name: Persist history database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f database/gold_macro.db
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GoldMacroAI history database"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
