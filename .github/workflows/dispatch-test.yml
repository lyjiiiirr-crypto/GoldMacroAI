name: Dispatch test

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch probe workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run schedule-probe.yml --repo lyjiiiirr-crypto/GoldMacroAI --ref main
